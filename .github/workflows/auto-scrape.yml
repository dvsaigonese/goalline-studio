name: Tự Động Cào Dữ Liệu Bóng Đá

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy Source Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: pip install -r requirements.txt

      - name: Thực thi Cỗ Máy Cào Dữ Liệu
        run: python scraper.py

      - name: Commit và Push JSON mới lên hệ thống
        run: |
          git config --global user.name "Goal-Line AutoBot"
          git config --global user.email "bot@goallinestudio.com"
          # Thêm || true để không văng lỗi nếu không có file
          git add data_*.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update chỉ số cầu thủ"
          git push || true