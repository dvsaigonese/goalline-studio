name: Tự Động Cào Dữ Liệu Bóng Đá

on:
  schedule:
    - cron: '0 2 * * *' # Chạy vào 2h sáng UTC mỗi ngày
  workflow_dispatch: # Nút bấm chạy thủ công trên GitHub

permissions:
  contents: write # Cấp quyền cho bot được phép push file JSON mới lên

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy Source Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: pip install -r requirements.txt

      - name: Thực thi Cỗ Máy Cào Dữ Liệu
        run: python scraper.py

      - name: Commit và Push JSON mới lên hệ thống
        run: |
          git config --global user.name "Goal-Line AutoBot"
          git config --global user.email "bot@goallinestudio.com"
          git add data_*.json
          # Lệnh này đảm bảo nếu không có thay đổi data, workflow không bị báo lỗi
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update chỉ số cầu thủ"
          git push