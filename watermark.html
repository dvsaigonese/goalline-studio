<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Watermark | Goal-Line Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div style="font-family: 'Albula'; font-weight: bold; position: absolute; left: -9999px; top: -9999px;">HACK FONT</div>

    <div class="app-container">
        <nav class="toolbar">
            <div class="tool-group">
                <a href="index.html" id="home-btn" class="tool-btn" title="Home">
                    <i class="fa-solid fa-home"></i>
                </a>
                <a href="watermark.html" class="tool-btn active" title="Watermark Tool" style="color: white; background: var(--primary);">
                    <i class="fa-solid fa-layer-group"></i>
                </a>
            </div>
            <div class="spacer"></div>
            <div class="tool-group bottom">
                <button id="export-wm-btn" class="tool-btn primary" title="Export Image">
                    <i class="fa-solid fa-download"></i>
                </button>
            </div>
        </nav>

        <main class="canvas-area">
            <div class="canvas-wrapper" id="wm-wrapper" style="box-shadow: none; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative;">
                
                <div id="empty-state" style="color: var(--text-muted); text-align: center; border: 2px dashed var(--border); padding: 50px; border-radius: 12px; position: absolute; z-index: 2;">
                    <i class="fa-solid fa-images" style="font-size: 3rem; margin-bottom: 15px;"></i>
                    <p>Setup layout and upload images</p>
                </div>
                
                <canvas id="wm-canvas" style="max-width: 100%; max-height: 85vh; object-fit: contain; box-shadow: 0 0 30px rgba(0,0,0,0.8); background: black; display: block; position: relative; z-index: 1;"></canvas>
            </div>
        </main>

        <aside class="settings-panel">
            <h3>Layout & Watermark</h3>

            <div class="wm-workflow-card">
                <label style="color: white; font-weight: bold; margin-bottom: 10px; display: block;">1. Setup Layout (4:5)</label>
                
                <label>Mode:</label>
                <select id="layout-mode" class="wm-select">
                    <option value="single">Single Image</option>
                    <option value="collage">Collage (Split)</option>
                </select>

                <div id="collage-options" style="display: none;">
                    <label>Split Direction:</label>
                    <select id="split-direction" class="wm-select">
                        <option value="vertical">Vertical (|||)</option>
                        <option value="horizontal">Horizontal (三)</option>
                    </select>

                    <label>Number of Splits:</label>
                    <input type="number" id="split-count" class="form-control" min="2" max="10" value="2" style="margin-bottom: 10px;">
                </div>
            </div>

            <div class="setting-group" id="upload-group">
                <label style="color: white; font-weight: bold;">2. Upload Images</label>
                <div id="file-inputs-container" style="background: #18181b; padding: 10px; border-radius: 8px; border: 1px solid #333; margin-top: 10px;">
                    </div>
            </div>
            
            <div class="setting-group collage-controls" id="collage-instructions" style="display: none;">
                <label style="color: var(--accent);"><i class="fa-solid fa-hand-pointer"></i> Edit Mode Active</label>
                <p style="font-size: 0.8rem; color: #ccc; margin: 5px 0;">
                    1. <strong>Click</strong> on a photo to select it.<br>
                    2. <strong>Drag</strong> to move it.<br>
                    3. <strong>Scroll mouse</strong> to zoom in/out.
                </p>
            </div>

            <hr>

            <div class="setting-group">
                <label style="color: white; font-weight: bold;">3. Article Title</label>
                <textarea id="wm-title" class="form-control" rows="3" placeholder="Enter post title here..." style="margin-bottom: 15px;"></textarea>
                
                <label>4. Pattern Intensity</label>
                <div class="row-input" style="align-items: center; margin-bottom: 10px;">
                    <input type="range" id="pattern-opacity" min="0" max="1" step="0.05" value="0.15" style="flex: 1; cursor: pointer;">
                    <span id="pattern-val" style="color: var(--accent); font-weight: bold; width: 40px; text-align: right;">15%</span>
                </div>

                <label>5. Film Grain</label>
                <div class="row-input" style="align-items: center; margin-bottom: 10px;">
                    <input type="range" id="grain-intensity" min="0" max="0.2" step="0.01" value="0.08" style="flex: 1; cursor: pointer;">
                    <span id="grain-val" style="color: var(--accent); font-weight: bold; width: 50px; text-align: right;">8%</span>
                </div>

                <label>6. Overall Brightness</label>
                <div class="row-input" style="align-items: center; margin-bottom: 10px;">
                    <input type="range" id="overall-brightness" min="0" max="200" step="10" value="120" style="flex: 1; cursor: pointer;">
                    <span id="brightness-val" style="color: var(--accent); font-weight: bold; width: 50px; text-align: right;">120%</span>
                </div>

                <small style="color: gray; font-size: 0.8rem;">Use {text} to color it yellow. Enter for new line.</small>
            </div>
        </aside>
    </div>

    <script type="module" src="js/watermark.js"></script>
</body>
</html>
